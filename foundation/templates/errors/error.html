{% extends "base.html" %}
{% block title %}{{ status }} · {{ settings.app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{% if status == 404 %}Page not found{% elif status == 403 %}Not allowed{% else %}Something went wrong{% endif %}</h1>
  <p>{{ detail }}</p>
  <p><a href="/">Back to the start</a></p>
</section>
{% endblock %}
