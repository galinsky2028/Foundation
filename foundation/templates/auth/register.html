{% extends "base.html" %}
{% block title %}Create account · {{ settings.app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  {% if error %}<p class="notice warn">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    {{ csrf_field(request) }}<input type="hidden" name="token" value="{{ token }}">
    <label>Email <input type="email" name="email" value="{{ email }}" {% if token %}readonly{% endif %} required></label>
    <label>Name <input name="name" autocomplete="name"></label>
    <label>Password (at least 10 characters) <input type="password" name="password" autocomplete="new-password" required minlength="10"></label>
    <button class="btn primary" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
