{% extends "base.html" %}
{% block title %}Sign in · {{ settings.app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="notice warn">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {{ csrf_field(request) }}<input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" autocomplete="email" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="muted"><a href="/reset">Forgot your password?</a>{% if settings.registration == 'open' %} · <a href="/register">Create an account</a>{% endif %}</p>
</section>
{% endblock %}
