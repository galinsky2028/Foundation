# Render Blueprint. Rename the service for each project. Values marked sync: false are entered in the
# Render dashboard (or set by Claude through the Render connector) and never stored in this file.
services:
  - type: web
    name: foundation
    runtime: docker
    plan: starter            # free also works for testing, but it sleeps after 15 minutes and cannot send SMTP email
    region: ohio             # same AWS region as Neon's us-east-2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Foundation
      - key: APP_BASE_URL
        sync: false          # e.g. https://foundation.onrender.com
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_DATABASE_URL
        sync: false          # Neon pooled connection string
      - key: APP_DATABASE_URL_DIRECT
        sync: false          # Neon direct connection string (migrations)
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_TRUST_PROXY
        value: "true"
